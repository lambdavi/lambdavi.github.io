<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #ebe4d8;
        --panel: #f7f3ec;
        --ink: #1c1915;
        --muted: #6f675e;
        --line: #d9d0c3;
        --accent: #8d3b24;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Source Sans 3", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-family: Newsreader, Georgia, serif;
        font-size: 1.35rem;
        font-weight: 500;
      }
      header p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.9rem; }
      header button, .tools button, .save {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font: inherit;
        border-radius: 999px;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }
      .save {
        background: var(--ink);
        color: var(--panel);
        border-color: var(--ink);
      }
      .save:disabled { opacity: 0.45; cursor: default; }
      main {
        display: grid;
        grid-template-columns: 1fr 300px;
        min-height: 0;
      }
      .stage-wrap {
        min-width: 0;
        min-height: 0;
        padding: 1.25rem;
      }
      #stage {
        position: relative;
        height: 100%;
        overflow: hidden;
        border-radius: 18px;
        background:
          linear-gradient(45deg, #e3dcd0 25%, transparent 25%),
          linear-gradient(-45deg, #e3dcd0 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e3dcd0 75%),
          linear-gradient(-45deg, transparent 75%, #e3dcd0 75%);
        background-color: #efe8de;
        background-size: 22px 22px;
        background-position: 0 0, 0 11px, 11px -11px, -11px 0;
        cursor: grab;
        touch-action: none;
      }
      #stage.is-dragging { cursor: grabbing; }
      #photo {
        position: absolute;
        left: var(--ix);
        top: var(--iy);
        width: calc(var(--iw) * 1px);
        height: auto;
        max-width: none;
        user-select: none;
        pointer-events: none;
      }
      #letter {
        position: absolute;
        left: var(--dx);
        top: var(--dy);
        font-family: Newsreader, Georgia, serif;
        font-weight: var(--dwg);
        font-size: var(--ds);
        line-height: 1;
        transform: scale(var(--dsx), var(--dsy));
        transform-origin: 0 0;
        color: #1c1915;
        user-select: none;
        pointer-events: none;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.85);
      }
      aside {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.1rem 1.15rem 1.4rem;
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow: auto;
      }
      .tools { display: flex; gap: 0.4rem; }
      .tools button { flex: 1; }
      .tools button.is-on {
        background: var(--ink);
        color: var(--panel);
        border-color: var(--ink);
      }
      label {
        display: grid;
        grid-template-columns: 4.6rem 1fr auto;
        align-items: center;
        gap: 0.45rem;
        margin: 0.45rem 0;
        color: var(--muted);
        font-size: 0.86rem;
      }
      label output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2.4rem; text-align: right; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .preview-label { margin: 0.4rem 0 0.35rem; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }
      #preview-frame {
        display: flex;
        align-items: flex-end;
        min-height: 140px;
        padding: 0.8rem;
        border-radius: 12px;
        background: #f4f0e8;
        color: #1c1915;
      }
      #preview-frame img { width: 120px; height: auto; }
      #status { margin: 0; color: var(--muted); font-size: 0.86rem; }
      @media (max-width: 800px) {
        main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
        .stage-wrap { height: 62vh; }
        aside { border-left: 0; border-top: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>D studio</h1>
        <p>Shape the letter, then place it on the photograph.</p>
      </div>
      <button type="button" class="save" id="save" disabled>Save SVG</button>
    </header>
    <main>
      <div class="stage-wrap">
        <div id="stage">
          <img id="photo" alt="" src="../assets/portrait.jpg" />
          <div id="letter"><span id="glyph">D</span></div>
        </div>
      </div>
      <aside>
        <div class="tools" role="group" aria-label="What dragging moves">
          <button type="button" id="mode-letter" class="is-on">Move D</button>
          <button type="button" id="mode-photo">Move photo</button>
        </div>
        <div>
          <label>Size <input id="size" type="range" min="80" max="560" step="1" value="280" /> <output id="size-out">280</output></label>
          <label>Weight <input id="weight" type="range" min="300" max="700" step="10" value="500" /> <output id="weight-out">500</output></label>
          <label>Width <input id="width" type="range" min="0.6" max="1.8" step="0.01" value="1" /> <output id="width-out">1.00</output></label>
          <label>Height <input id="height" type="range" min="0.6" max="1.8" step="0.01" value="1" /> <output id="height-out">1.00</output></label>
          <label>Zoom <input id="zoom" type="range" min="0.35" max="3" step="0.01" value="1" /> <output id="zoom-out">1.00</output></label>
        </div>
        <div>
          <p class="preview-label">On the page</p>
          <div id="preview-frame"><img id="preview" alt="Cropped D" /></div>
        </div>
        <p id="status">Drag the board to place the letter. Save writes initial.svg.</p>
      </aside>
    </main>
    <script>
      (function () {
        var stage = document.getElementById("stage");
        var photo = document.getElementById("photo");
        var letter = document.getElementById("letter");
        var glyph = document.getElementById("glyph");
        var saveButton = document.getElementById("save");
        var status = document.getElementById("status");
        var preview = document.getElementById("preview");
        var mode = "letter";
        var photoUrl = "";
        var previewUrl = "";
        var drag = null;
        var placed = false;
        var state = { dx: 80, dy: 40, size: 280, weight: 500, sx: 1, sy: 1, ix: 24, iy: 24, zoom: 1 };

        function apply() {
          var width = photo.naturalWidth ? photo.naturalWidth * fitScale() * state.zoom : 0;
          stage.style.setProperty("--ix", state.ix + "px");
          stage.style.setProperty("--iy", state.iy + "px");
          stage.style.setProperty("--iw", String(width));
          stage.style.setProperty("--dx", state.dx + "px");
          stage.style.setProperty("--dy", state.dy + "px");
          stage.style.setProperty("--ds", state.size + "px");
          stage.style.setProperty("--dwg", String(state.weight));
          stage.style.setProperty("--dsx", String(state.sx));
          stage.style.setProperty("--dsy", String(state.sy));
          document.getElementById("size-out").textContent = String(Math.round(state.size));
          document.getElementById("weight-out").textContent = String(state.weight);
          document.getElementById("width-out").textContent = state.sx.toFixed(2);
          document.getElementById("height-out").textContent = state.sy.toFixed(2);
          document.getElementById("zoom-out").textContent = state.zoom.toFixed(2);
        }

        function fitScale() {
          var box = Math.min(stage.clientWidth, stage.clientHeight) * 0.92;
          return box / Math.max(photo.naturalWidth, photo.naturalHeight);
        }

        function placeOnce() {
          if (placed || !photo.naturalWidth) return;
          placed = true;
          var width = photo.naturalWidth * fitScale();
          var height = photo.naturalHeight * fitScale();
          state.ix = (stage.clientWidth - width) / 2;
          state.iy = (stage.clientHeight - height) / 2;
          state.size = height * 0.62;
          state.dx = state.ix + width * 0.38;
          state.dy = state.iy + height * 0.06;
          document.getElementById("size").value = String(Math.round(state.size));
          apply();
        }

        function setMode(next) {
          mode = next;
          document.getElementById("mode-letter").classList.toggle("is-on", next === "letter");
          document.getElementById("mode-photo").classList.toggle("is-on", next === "photo");
          status.textContent = next === "letter"
            ? "Dragging moves the D across the photograph."
            : "Dragging moves the photograph under the D.";
        }

        document.getElementById("mode-letter").addEventListener("click", function () { setMode("letter"); });
        document.getElementById("mode-photo").addEventListener("click", function () { setMode("photo"); });

        ["size", "weight", "width", "height", "zoom"].forEach(function (id) {
          document.getElementById(id).addEventListener("input", function (event) {
            var value = Number(event.target.value);
            if (id === "size") state.size = value;
            if (id === "weight") state.weight = value;
            if (id === "width") state.sx = value;
            if (id === "height") state.sy = value;
            if (id === "zoom") state.zoom = value;
            apply();
            refreshPreview();
          });
        });

        stage.addEventListener("pointerdown", function (event) {
          drag = {
            x: event.clientX,
            y: event.clientY,
            dx: state.dx,
            dy: state.dy,
            ix: state.ix,
            iy: state.iy,
            mode: mode
          };
          stage.classList.add("is-dragging");
          stage.setPointerCapture(event.pointerId);
        });
        stage.addEventListener("pointermove", function (event) {
          if (!drag) return;
          var dx = event.clientX - drag.x;
          var dy = event.clientY - drag.y;
          if (drag.mode === "letter") {
            state.dx = drag.dx + dx;
            state.dy = drag.dy + dy;
          } else {
            state.ix = drag.ix + dx;
            state.iy = drag.iy + dy;
          }
          apply();
        });
        function endDrag() {
          if (!drag) return;
          drag = null;
          stage.classList.remove("is-dragging");
          refreshPreview();
        }
        stage.addEventListener("pointerup", endDrag);
        stage.addEventListener("pointercancel", endDrag);

        function counterCanvas() {
          var rect = letter.getBoundingClientRect();
          var dpr = 2;
          var font = state.weight + " " + state.size + "px Newsreader, Georgia, serif";
          var measure = document.createElement("canvas").getContext("2d");
          measure.font = font;
          var metrics = measure.measureText("D");
          var probe = document.createElement("span");
          probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline;overflow:hidden;";
          glyph.appendChild(probe);
          var baseline = (probe.getBoundingClientRect().top - rect.top) / state.sy;
          glyph.removeChild(probe);
          var padTop = Math.max((metrics.actualBoundingBoxAscent || 0) - baseline, state.size * 0.12) + 8;
          var padBottom = Math.max(0, baseline + (metrics.actualBoundingBoxDescent || 0) - rect.height / state.sy) + 4;
          var padLeft = Math.max(0, metrics.actualBoundingBoxLeft || 0) + 4;
          var padRight = Math.max(0, (metrics.actualBoundingBoxRight || 0) - rect.width / state.sx) + 4;
          var padTopPx = padTop * state.sy;
          var padBottomPx = padBottom * state.sy;
          var padLeftPx = padLeft * state.sx;
          var padRightPx = padRight * state.sx;
          var width = rect.width + padLeftPx + padRightPx;
          var height = rect.height + padTopPx + padBottomPx;
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(width * dpr));
          canvas.height = Math.max(1, Math.round(height * dpr));
          var ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.setTransform(dpr * state.sx, 0, 0, dpr * state.sy, dpr * padLeftPx, dpr * padTopPx);
          ctx.font = font;
          ctx.fillStyle = "#000";
          ctx.textBaseline = "alphabetic";
          ctx.fillText("D", 0, baseline);

          var W = canvas.width;
          var H = canvas.height;
          var pixels = ctx.getImageData(0, 0, W, H).data;
          var ink = new Uint8Array(W * H);
          var i;
          for (i = 0; i < W * H; i++) ink[i] = pixels[i * 4 + 3] > 12 ? 1 : 0;
          var seed = -1;
          for (y = Math.floor(H * 0.32); y < Math.floor(H * 0.72) && seed < 0; y++) {
            var edges = [];
            var inside = false;
            for (x = 0; x < W; x++) {
              var on = ink[y * W + x] === 1;
              if (on !== inside) { edges.push(x); inside = on; }
            }
            if (edges.length >= 4) {
              var gapStart = edges[1];
              var gapEnd = edges[2] - 1;
              if (gapEnd > gapStart + 2) seed = y * W + Math.floor((gapStart + gapEnd) / 2);
            }
          }
          if (seed < 0) return null;
          var seen = new Uint8Array(W * H);
          var stack = [seed];
          seen[seed] = 1;
          var mask = ctx.createImageData(W, H);
          var out = mask.data;
          while (stack.length) {
            var index = stack.pop();
            if (ink[index]) continue;
            var p = index * 4;
            out[p] = out[p + 1] = out[p + 2] = out[p + 3] = 255;
            x = index % W;
            y = (index - x) / W;
            if (x > 0 && !seen[index - 1]) { seen[index - 1] = 1; stack.push(index - 1); }
            if (x < W - 1 && !seen[index + 1]) { seen[index + 1] = 1; stack.push(index + 1); }
            if (y > 0 && !seen[index - W]) { seen[index - W] = 1; stack.push(index - W); }
            if (y < H - 1 && !seen[index + W]) { seen[index + W] = 1; stack.push(index + W); }
          }
          var filled = 0;
          for (i = 0; i < W * H; i++) if (out[i * 4 + 3]) filled++;
          if (filled < 20 || filled > W * H * 0.55) return null;
          var radius = Math.round(4 * dpr);
          var grown = new Uint8ClampedArray(out);
          for (y = 0; y < H; y++) {
            for (x = 0; x < W; x++) {
              if (!out[(y * W + x) * 4 + 3]) continue;
              for (var dy = -radius; dy <= radius; dy++) {
                var ny = y + dy;
                if (ny < 0 || ny >= H) continue;
                for (var dx = -radius; dx <= radius; dx++) {
                  if (dx * dx + dy * dy > radius * radius) continue;
                  var nx = x + dx;
                  if (nx < 0 || nx >= W) continue;
                  var q = (ny * W + nx) * 4;
                  grown[q] = grown[q + 1] = grown[q + 2] = grown[q + 3] = 255;
                }
              }
            }
          }
          for (i = 0; i < out.length; i++) out[i] = grown[i];
          ctx.putImageData(mask, 0, 0);
          return { url: canvas.toDataURL(), baseline: baseline, width: width, height: height, padTop: padTopPx, padLeft: padLeftPx };
        }

        function buildSvg(fill) {
          var mask = counterCanvas();
          if (!mask || !photoUrl) return "";
          var photoBox = photo.getBoundingClientRect();
          var letterBox = letter.getBoundingClientRect();
          var ix = photoBox.left - letterBox.left + mask.padLeft;
          var iy = photoBox.top - letterBox.top + mask.padTop;
          return [
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + mask.width.toFixed(2) + " " + mask.height.toFixed(2) + '" role="img" aria-label="D">',
            "<defs><mask id=\"counter\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"" + mask.width.toFixed(2) + "\" height=\"" + mask.height.toFixed(2) + "\">",
            "<image href=\"" + mask.url + "\" x=\"0\" y=\"0\" width=\"" + mask.width.toFixed(2) + "\" height=\"" + mask.height.toFixed(2) + "\"/></mask></defs>",
            "<image href=\"" + photoUrl + "\" x=\"" + ix.toFixed(2) + "\" y=\"" + iy.toFixed(2) + "\" width=\"" + photoBox.width.toFixed(2) + "\" height=\"" + photoBox.height.toFixed(2) + "\" mask=\"url(#counter)\"/>",
            "<text x=\"0\" y=\"" + mask.baseline.toFixed(2) + "\" font-family=\"Newsreader, Georgia, serif\" font-weight=\"" + state.weight + "\" font-size=\"" + state.size + "\" fill=\"" + fill + "\" transform=\"translate(" + mask.padLeft.toFixed(2) + " " + mask.padTop.toFixed(2) + ") scale(" + state.sx + " " + state.sy + ")\">D</text>",
            "</svg>"
          ].join("");
        }

        function refreshPreview() {
          var svg = buildSvg("#1c1915");
          if (!svg) return;
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
          preview.src = previewUrl;
        }

        saveButton.addEventListener("click", function () {
          var svg = buildSvg("currentColor");
          if (!svg) {
            status.textContent = "The counter of the D could not be traced. Make the letter a bit larger.";
            return;
          }
          var blob = new Blob([svg], { type: "image/svg+xml" });
          var link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "initial.svg";
          link.click();
          fetch("/api/initial", {
            method: "POST",
            headers: { "Content-Type": "image/svg+xml" },
            body: svg
          }).then(function (response) {
            status.textContent = response.ok
              ? "Saved assets/initial.svg and downloaded a copy. Paste it in place of the D."
              : "Downloaded initial.svg. The site folder could not store a copy.";
          }).catch(function () {
            status.textContent = "Downloaded initial.svg.";
          });
        });

        photo.addEventListener("load", function () {
          fetch("../assets/portrait.jpg")
            .then(function (response) { return response.blob(); })
            .then(function (blob) {
              return new Promise(function (resolve) {
                var reader = new FileReader();
                reader.onload = function () { resolve(reader.result); };
                reader.readAsDataURL(blob);
              });
            })
            .then(function (url) {
              photoUrl = url;
              placeOnce();
              document.fonts.ready.then(function () {
                saveButton.disabled = false;
                refreshPreview();
              });
            });
        });

        window.addEventListener("resize", function () {
          apply();
          refreshPreview();
        });
        apply();
      })();
    </script>
  </body>
</html>
